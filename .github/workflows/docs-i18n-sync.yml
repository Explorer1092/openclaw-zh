name: Docs i18n Sync

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zh
          fetch-depth: 0

      - name: Sync upstream English docs into zh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openclaw/openclaw.git || true
          git fetch upstream main
          # Sync English docs from upstream into zh branch, preserving .zh.md
          git ls-tree -r --name-only upstream/main -- docs/ scripts/docs-i18n-hash.ts \
            | grep -v '\.zh\.md$' \
            | while IFS= read -r f; do
                git checkout upstream/main -- "$f" 2>/dev/null || true
              done
          # Remove English docs deleted upstream (keep .zh.md)
          comm -23 \
            <(git ls-files -- 'docs/*.md' | grep -v '\.zh\.md$' | sort) \
            <(git ls-tree -r --name-only upstream/main -- docs/ | grep -v '\.zh\.md$' | sort) \
            | xargs -r git rm --quiet 2>/dev/null || true
          git add docs/ scripts/docs-i18n-hash.ts
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync upstream English docs"
            git push origin zh
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Check translation status
        id: check
        run: |
          output=$(bun scripts/docs-i18n-hash.ts check --json || true)
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          missing=$(echo "$output" | jq '.missing | length')
          outdated=$(echo "$output" | jq '.outdated | length')
          echo "count=$((missing + outdated))" >> "$GITHUB_OUTPUT"

      - name: Translate docs
        if: steps.check.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          prompt: |
            The i18n check found docs that need translation. Here is the JSON report:

            ${{ steps.check.outputs.result }}

            For each missing or outdated file:
            1. Read the English source
            2. Create or update the .zh.md translation (Chinese Simplified)
            3. Run `bun scripts/docs-i18n-hash.ts update <file.zh.md>` to stamp the hash

            After all translations, run `bun scripts/docs-i18n-hash.ts check` to verify.

            Then commit all changes directly to the current branch:
            ```
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/**/*.zh.md
            git commit -m "docs: sync Chinese translations"
            git push
            ```
          allowed_tools: Bash,Read,Write,Edit,Glob,Grep
          model: sonnet
